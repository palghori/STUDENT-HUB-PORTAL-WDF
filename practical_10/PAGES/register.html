<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="../CSS/script.css" />
  </head>
  <body>
    <nav class="navbar">
      <a class="brand" href="index.html">StudentHub</a>
      <div class="nav-links">
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="courses.html">Courses</a>
        <a href="assignment.html">Assignments</a>
        <a href="attendence.html">Attendance</a>
        <a href="result.html">Result</a>
        <a href="events.html">Events</a>
        <a href="profile.html">Profile</a>
        <a href="contact.html">Contact</a>
        
      
        <button class="toggle-btn" onclick="toggleDarkMode()" style="width: auto; padding: 5px 10px; margin-left: 10px; border-radius: 5px; cursor: pointer; font-weight: bold;">Toggle Dark Mode</button>
      </div>
    </nav>

    <main>
      <section class="form-box">
        <h2>Create Account</h2>
        <form onsubmit="validateAuth(event, 'register')">
          <label>Full Name</label>
          <input id="name" type="text" placeholder="Your name" required />
          
          <label for="enrollment">Enrollment ID</label>
          <input id="enrollment" type="text" placeholder="Enter enrollment ID (e.g., 25DCE030 or D2DCE030)" required />
          
          <label>Email</label>
          <input id="email" type="email" placeholder="student@example.com" required />
          
          <label>Mobile Number</label>
          <input id="mobile" type="text" placeholder="10-digit mobile number" required />
          
          <label>Password</label>
          <input id="password" type="password" placeholder="Create password" required />
          
          <label>Confirm Password</label>
          <input id="confirmPassword" type="password" placeholder="Confirm password" required />
          
          <label>Course</label>
          <select id="course" required>
            <option value="">Select Course</option>
            <option value="BTech">B.Tech</option>
            <option value="MTech">M.Tech</option>
            <option value="Diploma">Diploma</option>
          </select>
          
          <label>Year</label>
          <select id="year" required>
            <option value="">Select Year</option>
            <option value="1">1st Year</option>
            <option value="2">2nd Year</option>
            <option value="3">3rd Year</option>
            <option value="4">4th Year</option>
          </select>
          
          <label>Gender</label>
          <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <input type="radio" name="gender" value="Male" required style="width: auto;"> Male
            <input type="radio" name="gender" value="Female" required style="width: auto;"> Female
          </div>
          
          <div style="display: flex; align-items: center; gap: 5px; margin-bottom: 10px;">
            <input type="checkbox" id="terms" required style="width: auto;">
            <label for="terms" style="margin: 0; font-weight: normal;">I accept the terms and conditions</label>
          </div>
          
          <button type="submit">Register</button>
        </form>
      </section>
    </main>
    <script src="../java.js"></script>
  </body>
</html>
