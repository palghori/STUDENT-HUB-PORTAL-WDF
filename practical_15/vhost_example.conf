# ====================================================================
# STUDENT HUB PORTAL - Apache Virtual Host Configuration
# For local deployment in XAMPP (httpd-vhosts.conf)
# ====================================================================

# Step 1: Open /Applications/XAMPP/xamppfiles/etc/extra/httpd-vhosts.conf
#         (or C:\xampp\apache\conf\extra\httpd-vhosts.conf on Windows)
# Step 2: Append the VirtualHost configuration below:

<VirtualHost *:80>
    ServerAdmin admin@studenthub.com
    # Set DocumentRoot to your Practical 15 PAGES directory:
    DocumentRoot "/Applications/XAMPP/xamppfiles/htdocs/STUDENT HUB PORTAL WDF/practical 15/PAGES"
    ServerName studenthub.local
    ServerAlias www.studenthub.local

    <Directory "/Applications/XAMPP/xamppfiles/htdocs/STUDENT HUB PORTAL WDF/practical 15/PAGES">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/studenthub-error_log"
    CustomLog "logs/studenthub-access_log" common
</VirtualHost>

# Step 3: Add the custom domain entry to your hosts file (/etc/hosts on macOS/Linux or C:\Windows\System32\drivers\etc\hosts on Windows):
# 127.0.0.1   studenthub.local www.studenthub.local
#
# Step 4: Restart Apache in XAMPP and navigate to:
# http://studenthub.local/index.php
