    <meta charset="UTF-8" />

    <title>Register</title>
    <link rel="stylesheet" href="../CSS/script.css" />
  </head>
  <body>
    <nav class="navbar">
      <a class="brand" href="index.html">StudentHub</a>
      <div class="nav-links">
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
        <a href="index.html">Home</a>

        <button class="toggle-btn" onclick="toggleDarkMode()" style="width: auto; padding: 5px 10px; margin-left: 10px; border-radius: 5px; cursor: pointer; font-weight: bold;">Toggle Dark Mode</button>
      </div>
    </nav>

    <main>
      <section class="form-box">
        <h2>Create Account</h2>
        <form onsubmit="validateAuth(event, 'register')">
          <label>Full Name</label>
          <input type="text" placeholder="Your name" required />
          <label for="enrollment">Enrollment ID</label>
          <input id="enrollment" type="text" placeholder="Enter enrollment ID (e.g., 25DCE030)" required />
          <label>Email</label>
          <input type="email" placeholder="student@example.com" />
          <label>Password</label>
          <input type="password" placeholder="Create password" />
          <button type="submit">Register</button>
        </form>
      </section>
    </main>
    <script src="../java.js"></script>
  </body>
</html>
